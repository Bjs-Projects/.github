name: Organization defaults check

on:
  push:
    branches:
      - main
      - "work/**"
      - "recovery/**"
    paths:
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/defaults-check.yml"
      - "workflow-templates/**"
      - "scripts/validate_defaults.py"
  pull_request:
    paths:
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/defaults-check.yml"
      - "workflow-templates/**"
      - "scripts/validate_defaults.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defaults-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Compile validator
        run: python -m py_compile scripts/validate_defaults.py

      - name: Validate organization defaults
        run: python scripts/validate_defaults.py
