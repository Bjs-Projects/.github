name: Feature request
description: Propose a concrete capability or improvement
title: "feature: "
labels:
  - type:feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem does this solve and for whom?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true for completion.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: References or evidence
      description: Screenshots, examples, prior decisions, or constraints.
