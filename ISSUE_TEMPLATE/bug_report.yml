name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels:
  - type:bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact steps, inputs, project version, and environment.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, video, error text, or failing test.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected, and how severe is it?
    validations:
      required: true
