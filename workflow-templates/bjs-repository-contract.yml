name: Bjs Repository Contract

on:
  pull_request:
    branches: [ $default-branch ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install verified Git LFS 3.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/git-lfs-linux-amd64-v3.7.1.tar.gz \
            https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz
          echo "1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08  /tmp/git-lfs-linux-amd64-v3.7.1.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/git-lfs-linux-amd64-v3.7.1.tar.gz -C /tmp
          sudo /tmp/git-lfs-3.7.1/install.sh
          git lfs version

      - name: Pull and verify root Git LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull
          git lfs fsck
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import re
          import subprocess
          from pathlib import Path

          pointer_re = re.compile(
              r"\Aversion https://git-lfs\.github\.com/spec/v1\n"
              r"oid sha256:([0-9a-f]{64})\n"
              r"size ([1-9][0-9]*)\n?\Z"
          )
          output = subprocess.check_output(
              ["git", "lfs", "ls-files", "--name-only"], text=True
          )
          for raw_path in output.splitlines():
              relative = raw_path.strip()
              if not relative:
                  continue
              pointer = subprocess.check_output(
                  ["git", "show", f"HEAD:{relative}"], text=True
              )
              match = pointer_re.fullmatch(pointer)
              if not match:
                  raise SystemExit(f"invalid committed Git LFS pointer: {relative}")
              expected_oid = match.group(1)
              expected_size = int(match.group(2))
              data = Path(relative).read_bytes()
              actual_oid = hashlib.sha256(data).hexdigest()
              if len(data) != expected_size:
                  raise SystemExit(
                      f"Git LFS size mismatch for {relative}: "
                      f"expected {expected_size}, got {len(data)}"
                  )
              if actual_oid != expected_oid:
                  raise SystemExit(
                      f"Git LFS SHA-256 mismatch for {relative}: "
                      f"expected {expected_oid}, got {actual_oid}"
                  )
              print(f"verified Git LFS object: {relative} ({expected_size} bytes)")
          PY

      - name: Verify recursive submodule Git LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git submodule foreach --recursive '
            git lfs install --local >/dev/null &&
            git lfs pull &&
            git lfs fsck
          '

      - name: Enforce ordinary Git blob limits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          warning_limit = 50 * 1024 * 1024
          failure_limit = 100 * 1024 * 1024
          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "HEAD"], text=True
          ).splitlines()
          object_paths: dict[str, str] = {}
          for line in objects:
              oid, *path_parts = line.split(" ", 1)
              if path_parts:
                  object_paths[oid] = path_parts[0]
          if not object_paths:
              raise SystemExit(0)
          batch_input = "".join(f"{oid}\n" for oid in object_paths)
          details = subprocess.check_output(
              ["git", "cat-file", "--batch-check=%(objectname) %(objecttype) %(objectsize)"],
              input=batch_input,
              text=True,
          ).splitlines()
          failures: list[str] = []
          for detail in details:
              oid, object_type, raw_size = detail.split()
              if object_type != "blob":
                  continue
              size = int(raw_size)
              path = object_paths.get(oid, oid)
              if size > failure_limit:
                  failures.append(f"ordinary Git blob exceeds 100 MiB: {path} ({size} bytes)")
              elif size > warning_limit:
                  print(f"::warning::ordinary Git blob exceeds 50 MiB: {path} ({size} bytes)")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Require immutable external GitHub Action pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          uses_re = re.compile(r"^\s*uses:\s*([^\s#]+)(?:\s+#\s*(.+))?$", re.MULTILINE)
          full_sha_re = re.compile(r"^[0-9a-f]{40}$")
          failures: list[str] = []
          for pattern in ("*.yml", "*.yaml"):
              for path in sorted(Path(".github/workflows").glob(pattern)):
                  text = path.read_text(encoding="utf-8")
                  for spec, comment in uses_re.findall(text):
                      if spec.startswith("./"):
                          continue
                      if "@" not in spec:
                          failures.append(f"{path}: external Action missing ref: {spec}")
                          continue
                      action, ref = spec.rsplit("@", 1)
                      if not full_sha_re.fullmatch(ref):
                          failures.append(f"{path}: mutable Action ref: {action}@{ref}")
                      if not comment.strip():
                          failures.append(f"{path}: Action pin lacks release comment: {spec}")
          if failures:
              raise SystemExit("immutable Action pin failures:\n" + "\n".join(failures))
          PY
